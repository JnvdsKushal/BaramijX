<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── Primary SEO ──────────────────────────────────────── -->
  <title>BaramijX | Professional Web Design, SEO &amp; Digital Marketing</title>
  <meta name="description"
    content="Transform your business with BaramijX — expert IT consulting, digital marketing, cloud solutions, AI integration, and custom web development. Get a free quote today." />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  <link rel="canonical" href="https://baramijx.com/" />

  <!-- ── Open Graph (Facebook, LinkedIn) ─────────────────── -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://baramijx.com/" />
  <meta property="og:site_name" content="BaramijX" />
  <meta property="og:title" content="BaramijX | Professional Web Design, SEO &amp; Digital Marketing" />
  <meta property="og:description"
    content="Transform your business with BaramijX — expert IT consulting, digital marketing, cloud solutions, AI integration, and custom web development. Get a free quote today." />
  <meta property="og:image" content="https://baramijx.com/assets/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="BaramijX IT Consultancy — Digital Transformation Experts" />
  <meta property="og:locale" content="en_US" />

  <!-- ── Twitter / X Card ────────────────────────────────── -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@baramijx" />
  <meta name="twitter:creator" content="@baramijx" />
  <meta name="twitter:title" content="BaramijX | Professional Web Design, SEO &amp; Digital Marketing" />
  <meta name="twitter:description"
    content="Transform your business with BaramijX — expert IT consulting, digital marketing, cloud, AI, and web development. Get a free quote." />
  <meta name="twitter:image" content="https://baramijx.com/assets/og-image.jpg" />

  <!-- ── Additional Meta ──────────────────────────────────── -->
  <meta name="author" content="BaramijX" />
  <meta name="theme-color" content="#1E3A8A" />
  <meta name="format-detection" content="telephone=no" />

  <!-- ── Preconnect for Performance ──────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://images.unsplash.com" />

  <!-- ── Structured Data: Organization ───────────────────── -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "BaramijX",
      "url": "https://baramijx.com",
      "logo": "https://baramijx.com/assets/logo.png",
      "description": "BaramijX is an IT consultancy providing digital transformation, SEO, web development, cloud infrastructure, and AI solutions for businesses.",
      "foundingDate": "2020",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "3020 Charles Dr",
        "addressLocality": "Wylie",
        "addressRegion": "TX",
        "postalCode": "75098",
        "addressCountry": "US"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "email": "hello@baramijx.com",
        "availableLanguage": "English"
      },
      "sameAs": [
        "https://linkedin.com/company/baramijx",
        "https://twitter.com/baramijx"
      ]
    }
    </script>

  <!-- ── Structured Data: LocalBusiness ──────────────────── -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["LocalBusiness", "ProfessionalService"],
      "name": "BaramijX IT Consultancy",
      "image": "https://baramijx.com/assets/og-image.jpg",
      "url": "https://baramijx.com",
      "email": "hello@baramijx.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "3020 Charles Dr",
        "addressLocality": "Wylie",
        "addressRegion": "TX",
        "postalCode": "75098",
        "addressCountry": "US"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 33.0154,
        "longitude": -96.5388
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
          "opens": "09:00",
          "closes": "18:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": "Saturday",
          "opens": "10:00",
          "closes": "14:00"
        }
      ],
      "priceRange": "$$"
    }
    </script>

  <!-- ── Structured Data: WebSite ─────────────────────────── -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "url": "https://baramijx.com",
      "name": "BaramijX",
      "description": "Expert IT Consulting, Digital Marketing, Cloud Solutions, AI Integration & Custom Web Development",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://baramijx.com/blog?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
